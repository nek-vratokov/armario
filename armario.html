<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi armario</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1c1b19;--mu:#78746c;--bd:#e3dfd7;--ac:#1c1b19;--ac-tx:#fff;--dg:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#222120;--tx:#f2efe9;--mu:#a09b92;--bd:#38362f;--ac:#f2efe9;--ac-tx:#171614;--dg:#f2b8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--card:#222120;--tx:#f2efe9;--mu:#a09b92;--bd:#38362f;--ac:#f2efe9;--ac-tx:#171614;--dg:#f2b8b5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0;font-weight:650}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px}
button.p{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
button.d{color:var(--dg)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--ac);color:var(--ac-tx);border-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
.bar input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--bd)}
.card .m{padding:8px 10px}
.card .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--mu);font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--bd);display:inline-block;flex:none}
.card.sel{outline:3px solid var(--ac)}
.empty{color:var(--mu);text-align:center;padding:48px 12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 24px;z-index:20}
.md{background:var(--bg);border-radius:16px;padding:16px;width:100%;max-width:520px;border:1px solid var(--bd)}
.md h2{margin:0 0 12px;font-size:18px}
.f{display:grid;gap:10px}
.f label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.f .r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:var(--bd)}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.of{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.of h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{display:flex;gap:8px;overflow-x:auto}
.st img{width:84px;height:112px;object-fit:cover;border-radius:8px;flex:none}
.msg{color:var(--mu);text-align:center;padding:40px 12px}
</style>
</head>
<body>
<main>
<header><h1>Mi armario</h1><button class="p" id="add">Agregar prenda</button></header>
<div class="tabs"><button id="t1" class="on">Prendas</button><button id="t2">Outfits</button></div>
<div id="note" style="color:var(--mu);font-size:13px;margin-bottom:10px"></div>
<div id="app"><div class="msg">Cargando…</div></div>
</main>
<div id="modal"></div>
<script>
const CATS=["Camisetas","Camisas","Buzos y chaquetas","Pantalones","Faldas y vestidos","Zapatos","Accesorios"];
const COLORS={Negro:"#111",Blanco:"#fff",Gris:"#888",Beige:"#d9c7a3",Café:"#6b4426",Azul:"#2f5fb3",Verde:"#3b7d4f",Rojo:"#c62828",Rosado:"#f0a1b8",Amarillo:"#f1c40f",Morado:"#7b3fa0",Naranja:"#e67e22",Otro:"#bbb"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let G=[],O=[],gcol=null,ocol=null,tab=1,q="",fc="",fk="";

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8))};im.onerror=()=>rej(new Error("img"));im.src=u})}

function render(){
 const a=$("#app");
 if(tab===1){
  let l=G.slice().sort((x,y)=>(y.created||0)-(x.created||0));
  if(fc)l=l.filter(g=>g.cat===fc);if(fk)l=l.filter(g=>g.color===fk);
  if(q){const t=q.toLowerCase();l=l.filter(g=>[g.name,g.brand,g.size].join(" ").toLowerCase().includes(t))}
  a.innerHTML=`<div class="bar"><input id="q" placeholder="Buscar por nombre, marca o talla" value="${esc(q)}">
  <select id="fc"><option value="">Categoría</option>${CATS.map(c=>`<option ${c===fc?"selected":""}>${c}</option>`).join("")}</select>
  <select id="fk"><option value="">Color</option>${Object.keys(COLORS).map(c=>`<option ${c===fk?"selected":""}>${c}</option>`).join("")}</select></div>
  ${l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty">${G.length?"Ninguna prenda coincide con el filtro.":"Aún no tienes prendas. Agrega la primera."}</div>`}`;
  $("#q").oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  $("#fc").onchange=e=>{fc=e.target.value;render()};$("#fk").onchange=e=>{fk=e.target.value;render()};
  a.querySelectorAll(".card").forEach(c=>c.onclick=()=>garmentForm(G.find(g=>g.id===c.dataset.id)));
 }else{
  const l=O.slice().sort((x,y)=>(y.created||0)-(x.created||0));
  a.innerHTML=`<div class="bar"><button class="p" id="no">Nuevo outfit</button></div>`+
  (l.length?l.map(o=>`<div class="of"><h3><span>${esc(o.name)}</span><button class="d" data-del="${o.id}">Eliminar</button></h3>
  <div class="st">${(o.items||[]).map(i=>G.find(g=>g.id===i)).filter(Boolean).map(g=>`<img src="${g.img}" alt="${esc(g.name)}" title="${esc(g.name)}">`).join("")}</div></div>`).join(""):`<div class="empty">Aún no tienes outfits guardados.</div>`);
  $("#no").onclick=outfitForm;
  a.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("¿Eliminar este outfit?"))ocol.doc(b.dataset.del).delete()});
 }
}
function card(g){return `<div class="card" data-id="${g.id}"><img src="${g.img}" alt="${esc(g.name)}"><div class="m"><div class="n">${esc(g.name)}</div>
<div class="s"><span class="dot" style="background:${COLORS[g.color]||"#bbb"}"></span>${esc(g.cat)}${g.size?" · "+esc(g.size):""}</div></div></div>`}

function close(){$("#modal").innerHTML=""}
function garmentForm(g){
 const e=!!g;g=g||{};let img=g.img||"";
 $("#modal").innerHTML=`<div class="ov"><div class="md"><h2>${e?"Editar prenda":"Nueva prenda"}</h2><div class="f">
 <img class="pv" id="pv" ${img?`src="${img}"`:'style="display:none"'} alt="">
 <label>Foto<input type="file" id="fi" accept="image/*"></label>
 <label>Nombre<input id="nm" value="${esc(g.name)}" placeholder="Ej. Buzo negro oversize"></label>
 <div class="r"><label>Categoría<select id="ct">${CATS.map(c=>`<option ${c===g.cat?"selected":""}>${c}</option>`).join("")}</select></label>
 <label>Color<select id="co">${Object.keys(COLORS).map(c=>`<option ${c===g.color?"selected":""}>${c}</option>`).join("")}</select></label></div>
 <div class="r"><label>Talla<input id="sz" value="${esc(g.size)}"></label><label>Marca<input id="br" value="${esc(g.brand)}"></label></div></div>
 <div class="act">${e?'<button class="d" id="dl">Eliminar</button>':""}<button id="cn">Cancelar</button><button class="p" id="sv">Guardar</button></div></div></div>`;
 $("#fi").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{img=await shrink(f);const p=$("#pv");p.src=img;p.style.display="block"}catch{alert("No se pudo leer la imagen.")}};
 $("#cn").onclick=close;
 if(e)$("#dl").onclick=async()=>{if(confirm("¿Eliminar esta prenda?")){await gcol.doc(g.id).delete();close()}};
 $("#sv").onclick=async()=>{
  if(!gcol){alert("Aún está cargando, intenta de nuevo en un momento.");return}
  const name=$("#nm").value.trim();if(!img){alert("Agrega una foto.");return}if(!name){alert("Escribe un nombre.");return}
  const d={name,cat:$("#ct").value,color:$("#co").value,size:$("#sz").value.trim(),brand:$("#br").value.trim(),img,created:g.created||Date.now()};
  try{e?await gcol.doc(g.id).set(d):await gcol.add(d);close()}catch{alert("No se pudo guardar.")}};
}
function outfitForm(){
 if(!G.length){alert("Primero agrega algunas prendas.");return}
 const sel=new Set();
 $("#modal").innerHTML=`<div class="ov"><div class="md" style="max-width:720px"><h2>Nuevo outfit</h2><div class="f"><label>Nombre<input id="on" placeholder="Ej. Salida del viernes"></label></div>
 <p style="color:var(--mu);margin:12px 0 8px">Toca las prendas que lo componen.</p><div class="grid" id="og">${G.map(card).join("")}</div>
 <div class="act"><button id="cn">Cancelar</button><button class="p" id="sv">Guardar</button></div></div></div>`;
 $("#og").querySelectorAll(".card").forEach(c=>c.onclick=()=>{const i=c.dataset.id;sel.has(i)?sel.delete(i):sel.add(i);c.classList.toggle("sel")});
 $("#cn").onclick=close;
 $("#sv").onclick=async()=>{const name=$("#on").value.trim();if(!name){alert("Escribe un nombre.");return}if(!sel.size){alert("Elige al menos una prenda.");return}
  try{await ocol.add({name,items:[...sel],created:Date.now()});close()}catch{alert("No se pudo guardar.")}};
}
$("#add").onclick=()=>garmentForm();
function local(key){let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
const out=()=>{try{localStorage.setItem(key,JSON.stringify(arr))}catch{}fire()};let fire=()=>{};
return{doc:id=>({set:async d=>{arr=arr.filter(x=>x.id!==id).concat({...d,id});out()},delete:async()=>{arr=arr.filter(x=>x.id!==id);out()}}),
add:async d=>{arr.push({...d,id:"l"+Date.now()+Math.random().toString(36).slice(2,6)});out()},
onSnapshot:f=>{fire=()=>f({docs:arr.map(x=>({id:x.id,data:()=>x}))});fire();return()=>{}}}}
$("#t1").onclick=()=>{tab=1;$("#t1").classList.add("on");$("#t2").classList.remove("on");render()};
$("#t2").onclick=()=>{tab=2;$("#t2").classList.add("on");$("#t1").classList.remove("on");render()};

(async()=>{
 try{
  let db=null,id=null;
  try{const [d,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(d&&user){id=await user.id();db=d}}catch{}
  if(db&&id){const base="data/users/"+id;gcol=db.collection(base+"/garments");ocol=db.collection(base+"/outfits")}
  else{gcol=local("armario_g");ocol=local("armario_o");$("#note").textContent="Modo local: no se pudo conectar la sincronización. Tus prendas se guardan solo en este navegador."}
  gcol.onSnapshot(s=>{G=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  ocol.onSnapshot(s=>{O=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
 }catch{$("#app").innerHTML='<div class="msg">No se pudo cargar tu armario.</div>'}
})();
</script>
</body>
</html>
